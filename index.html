<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Expectations</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1b1f2a; color: #eef; font: 15px system-ui, sans-serif; }
  main { max-width: 1112px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; min-height: 36px; }
  .label { color: #a9b2cc; margin-right: 2px; }
  button, select { font: inherit; }
  button { background: #2f6fb3; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:disabled { background: #3a4050; color: #8a90a0; cursor: default; }
  button.zone { border: 2px solid transparent; color: #111; font-weight: 600; }
  button.zone.active { border-color: #fff; }
  button.zone:disabled { opacity: 0.35; }
  button.small { padding: 2px 7px; background: #3a4258; }
  select { padding: 6px; background: #252b3a; color: #eef; border: 1px solid #3a4258; border-radius: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; color: #111; font-weight: 600; }
  #money { margin-left: auto; font-weight: 600; }
  #status { min-height: 1.4em; margin: 4px 0; }
  a { color: #8ec1ff; }
  canvas { width: 100%; height: auto; background: #252b3a; border-radius: 8px; touch-action: none; display: block; }
</style>
</head>
<body>
<main>
  <h1>Gate Expectations</h1>
  <div class="bar">
    <span class="label">Plane</span><select id="plane"></select>
    <span class="label">Speed</span><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select>
    <a id="analyze" href="stats.html" target="_blank">Analyze this plan &rarr;</a>
    <span id="money"></span>
  </div>
  <div class="bar" id="brushBar"></div>
  <div class="bar">
    <button id="go">Go</button>
    <button id="retry">Retry (same passengers)</button>
    <button id="new">New flight</button>
    <span id="callBar"></span>
  </div>
  <div class="bar" id="autoBar"></div>
  <div id="status"></div>
  <canvas id="c" width="1080" height="470"></canvas>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
