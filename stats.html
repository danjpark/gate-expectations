<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Expectations: Stats</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1b1f2a; color: #eef; font: 15px system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  a { color: #8ec1ff; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
  button, input, select { font: inherit; }
  button { background: #2f6fb3; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:disabled { background: #3a4050; color: #8a90a0; cursor: default; }
  input, select { padding: 6px; background: #252b3a; color: #eef; border: 1px solid #3a4258; border-radius: 6px; }
  input { width: 4.5em; }
  canvas#c { width: 100%; height: auto; background: #252b3a; border-radius: 8px; display: block; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid #333b50; vertical-align: middle; }
  th.l, td.l { text-align: left; }
  td.map canvas { display: block; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  #note, .legend { color: #a9b2cc; min-height: 1.4em; }
  .legend span { display: inline-block; width: 14px; height: 10px; margin: 0 4px 0 10px; vertical-align: 0; }
</style>
</head>
<body>
<main>
  <h1>Boarding time distributions</h1>
  <div><a href="index.html">&larr; back to the game</a> &middot; dev tool, not part of the game</div>
  <div class="legend" id="policy"></div>
  <div class="row">
    <label>Plane <select id="preset"></select></label>
    <label>Rows <input id="rows" type="number" min="2" max="80" value="12"></label>
    <label title="Seats per block, left to right; an aisle between each block">Seat blocks <input id="blocks" value="1-1" style="width:5.5em"></label>
    <label>Zones <select id="zones"><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Simulation flights <input id="n" type="number" value="2000" min="100" max="20000" step="100"></label>
  </div>
  <div class="row">
    <button id="search">Search zone patterns</button>
    <button id="refine">Refine best seat by seat</button>
    <span id="note"></span>
  </div>
  <canvas id="c" width="1100" height="340"></canvas>
  <div class="legend" id="legend"></div>
  <div class="scroll"><table id="t"></table></div>
</main>
<script type="module" src="src/stats-main.js"></script>
</body>
</html>
